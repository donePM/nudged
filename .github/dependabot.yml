version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # TypeScript 7 breaks many dependencies; stay on 6.x for now.
    ignore:
      - dependency-name: typescript
        versions: ['>= 7']
    groups:
      npm:
        patterns: ['*']

  # Also updates the SHA-pinned goreleaser-action in release.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
